        <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #f4f2ed;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --accent: #d95d39;
            --card-bg: #ffffff;
            --border: 1px solid rgba(0,0,0,0.08);
            --radius-lg: 24px;
            --radius-sm: 12px;
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-page {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .error-number {
            font-family: var(--font-serif);
            font-size: 12rem;
            font-weight: 400;
            line-height: 1;
            color: var(--accent);
            opacity: 0.15;
            margin-bottom: -2rem;
            letter-spacing: -0.05em;
        }

        .error-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 400;
            color: var(--text-main);
        }

        .error-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 4rem;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .error-btn.primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(217, 93, 57, 0.3);
        }

        .error-btn.primary:hover {
            background: #c54d2d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 93, 57, 0.4);
        }

        .error-btn.secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .error-btn.secondary:hover {
            background: #fff;
            border-color: var(--accent);
            color: var(--accent);
        }

        .error-btn .arrow {
            transition: transform 0.3s ease;
        }

        .error-btn:hover .arrow {
            transform: translateX(4px);
        }

        .error-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .error-decoration .decoration-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            filter: blur(40px);
        }

        .error-decoration .circle-1 {
            width: 300px;
            height: 300px;
            background: var(--accent);
            top: 10%;
            left: 10%;
            animation: float 8s ease-in-out infinite;
        }

        .error-decoration .circle-2 {
            width: 200px;
            height: 200px;
            background: var(--accent);
            bottom: 20%;
            right: 10%;
            animation: float 10s ease-in-out infinite reverse;
        }

        .error-decoration .circle-3 {
            width: 150px;
            height: 150px;
            background: var(--accent);
            top: 50%;
            right: 30%;
            animation: float 12s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, -30px);
            }
        }

        @media (max-width: 600px) {
            .error-number {
                font-size: 8rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-actions {
                flex-direction: column;
            }
            
            .error-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-decoration">
        <div class="decoration-circle circle-1"></div>
        <div class="decoration-circle circle-2"></div>
        <div class="decoration-circle circle-3"></div>
    </div>

    <div class="error-page">
        <div class="error-number">404</div>
        <h1 class="error-title">页面未找到</h1>
        <p class="error-description">
            抱歉，您访问的页面似乎已迷失在数字海洋中。
        </p>
        <div class="error-actions">
            <a href="/" class="error-btn primary">
                <span>返回首页</span>
                <span class="arrow">→</span>
            </a>
            <a href="/archives/" class="error-btn secondary">
                浏览归档
            </a>
        </div>
    </div>
</body>
